# GitHub Actions로 주간 처리량 계산
name: Weekly Throughput

on:
  schedule:
    - cron: "0 0 * * 0" # 매주 일요일 00:00 UTC 실행

jobs:
  calculate-throughput:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Get Closed Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub CLI를 사용하여 닫힌 이슈 조회 및 카운트
          CLOSED_ISSUES=$(gh issue list --state closed --json closedAt --jq 'length')
          echo "Closed issues: $CLOSED_ISSUES"
