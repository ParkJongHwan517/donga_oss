# 새 이슈/PR이 열리면 안내 댓글을 자동으로 남긴다. (초안)
name: Auto Reply

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  reply-issue:
    # 봇이 만든 이슈(주간 요약 등)에는 응답하지 않는다
    if: github.event_name == 'issues' && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "이슈를 남겨주셔서 감사합니다. 🙌
          - **48시간 이내**에 1차 답변을 드립니다. (SLA)
          - 재현 방법, 기대 동작, 실제 동작을 적어주시면 처리가 빨라집니다.
          - 질문이나 아이디어는 [Discussions](https://github.com/${REPO}/discussions)도 이용해 주세요.
          - 문서: [Wiki](https://github.com/${REPO}/wiki)"

  reply-pr:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$NUMBER" --repo "$REPO" --body "PR을 올려주셔서 감사합니다. 🙌
          - 제목이 Conventional Commits 형식인지 확인해 주세요. (예: \`feat: 기능 추가\`)
          - 리뷰는 \`[MUST]\` / \`[SHOULD]\` 태그로 진행됩니다. 자세한 내용은 REVIEW_GUIDE.md를 참고하세요.
          - \`[MUST]\` 항목을 모두 해결하면 병합할 수 있습니다."
