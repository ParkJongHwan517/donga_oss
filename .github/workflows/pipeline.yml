# Build -> Test -> Deploy 파이프라인 (선택적 배포).
#   - 변경 파일 감지: 앱 코드가 바뀐 경우에만 Build/Test/Deploy를 실행한다.
#   - 브랜치/PR 조건: PR에서는 Build/Test까지만, 배포는 main 브랜치 push에서만 한다.
name: Build Test Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "배포 단계까지 실행할지 여부"
        type: boolean
        default: true

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 0) Changes: 이번 변경에 앱 코드가 포함됐는지 판단한다.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # 앱 코드로 보는 경로: 패키지, 테스트, 패키징 설정, 의존성 파일
          APP_PATTERN='^(fit/|tests/|pyproject\.toml$|requirements.*\.txt$)'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: treat as app changed."
            CHANGED_APP=true
            FILES="(manual run)"
          else
            if [ "$EVENT" = "pull_request" ]; then
              BASE="$PR_BASE"
            else
              BASE="$PUSH_BEFORE"
            fi

            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No base commit: treat as app changed."
              CHANGED_APP=true
              FILES="(no base commit)"
            else
              FILES=$(git diff --name-only "$BASE" "$HEAD_SHA")
              if echo "$FILES" | grep -qE "$APP_PATTERN"; then
                CHANGED_APP=true
              else
                CHANGED_APP=false
              fi
            fi
          fi

          echo "app=$CHANGED_APP" >> "$GITHUB_OUTPUT"
          {
            echo "## 변경 파일 감지"
            echo "- 앱 코드 변경: **$CHANGED_APP**"
            echo ""
            echo "변경된 파일:"
            echo '```'
            echo "$FILES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) Build: 패키지를 만들어 아티팩트로 올린다.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Read package version
        id: meta
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 2) Test: 빌드된 패키지를 내려받아 설치한 뒤, 설치본으로 테스트한다.
  test:
    name: Test built package (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      # 소스 폴더(fit/)가 아니라 설치된 패키지를 검증하도록 tests만 복사해서 실행한다.
      - name: Run tests against installed package
        shell: bash
        run: |
          mkdir ../run-tests
          cp -r tests ../run-tests/tests
          cd ../run-tests
          python -m pytest -q tests

  # 3) Deploy: main 브랜치 push(또는 수동 실행)에서만, 테스트를 통과한 아티팩트를 배포한다.
  deploy:
    name: Deploy (production)
    needs: [build, test]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check secrets (값은 출력하지 않음)
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Deploy secrets are available."
          else
            echo "::warning::SUPABASE_URL / SUPABASE_KEY secrets are not configured."
          fi

      # 실제 서버가 없으므로 배포 동작은 배포 폴더를 만드는 것으로 대신한다.
      - name: Deploy package (simulated)
        run: |
          mkdir -p deployed
          cp dist/*.whl deployed/
          {
            echo "version: ${{ needs.build.outputs.version }}"
            echo "commit: ${{ github.sha }}"
            echo "deployed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "files:"
            ls deployed | sed 's/^/  - /'
          } > deployed/MANIFEST.txt
          cat deployed/MANIFEST.txt

      - name: Upload deploy report
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report
          path: deployed/
          retention-days: 7

  # 4) Summary: 어떤 단계가 실행/건너뜀인지 한눈에 보여준다.
  summary:
    name: Pipeline summary
    needs: [changes, build, test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write stage results
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          {
            echo "## 파이프라인 실행 결과"
            echo "- 이벤트: \`$EVENT\` / 브랜치: \`$REF\`"
            echo "- 앱 코드 변경: **$APP_CHANGED**"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| Build | $BUILD |"
            echo "| Test | $TEST |"
            echo "| Deploy | $DEPLOY |"
          } >> "$GITHUB_STEP_SUMMARY"
