title: "RFC: "
labels: ["rfc"]
body:
  - type: markdown
    attributes:
      value: |
        큰 변경을 하기 전에 의견을 모으는 RFC(Request for Comments) 양식입니다.
        결론이 나면 [ADR](https://github.com/ParkJongHwan517/donga_oss/tree/main/docs/adr)로 기록합니다.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 제안을 한두 문장으로 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 배경과 동기
      description: 어떤 문제를 해결하려는 건가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 구체적으로 무엇을 어떻게 바꾸려는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 검토한 다른 방법과 선택하지 않은 이유를 적어 주세요.
  - type: textarea
    id: questions
    attributes:
      label: 열린 질문
      description: 의견이 필요한 부분을 적어 주세요.
  - type: dropdown
    id: deadline
    attributes:
      label: 의견 수렴 기간
      options:
        - 3일
        - 1주
        - 2주
    validations:
      required: true
